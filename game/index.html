<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apex Atlas — a duel of real champions</title>
<meta name="description" content="Apex Atlas: an original card duel of real animals, wonders and worlds. Call a stat, commit a card, take the trick.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M12 2l2.2 7.2L22 12l-7.8 2.8L12 22l-2.2-7.2L2 12l7.8-2.8z%27 fill=%27%23d9a441%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="./styles/theme.css">
<link rel="stylesheet" href="./styles/cards.css">
<link rel="stylesheet" href="./styles/table.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="app">
  <section id="screen-title" class="screen" aria-label="Title"></section>
  <section id="screen-match" class="screen" aria-label="Card duel"></section>
  <section id="screen-pack" class="screen" aria-label="Booster pack"></section>
  <section id="screen-collection" class="screen" aria-label="Atlas collection"></section>
  <section id="screen-result" class="screen overlay" aria-label="Duel result" hidden></section>
</div>
<div id="modal" class="modal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>
<p id="status" role="status" aria-live="polite" class="visually-hidden"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
